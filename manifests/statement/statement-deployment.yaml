apiVersion: apps/v1
kind: Deployment
metadata:
  name: statement
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: statement
  template:
    metadata:
      labels:
        io.kompose.service: statement
    spec:
      containers:
        - name: statement
          image: statement:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DEAL_URL
              value: http://deal:8081
            - name: SERVER_PORT
              value: "8080"
            - name: SPRINGDOC_API_DOCS_PATH
              value: /statement/v3/api-docs
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
      restartPolicy: Always
