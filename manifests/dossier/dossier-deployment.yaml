apiVersion: apps/v1
kind: Deployment
metadata:
  name: dossier
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: dossier
  template:
    metadata:
      labels:
        io.kompose.service: dossier
    spec:
      containers:
        - name: dossier
          image: dossier:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SERVER_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: mail-env
          ports:
            - containerPort: 8080
      restartPolicy: Always
