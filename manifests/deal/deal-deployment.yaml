apiVersion: apps/v1
kind: Deployment
metadata:
  name: deal
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: deal
  template:
    metadata:
      labels:
        io.kompose.service: deal
    spec:
      containers:
        - name: deal
          image: deal:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CALCULATOR_URL
              value: http://calculator:8080/calculator
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SERVER_PORT
              value: "8080"
            - name: SPRINGDOC_API_DOCS_PATH
              value: /deal/v3/api-docs
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/creditbank
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
      restartPolicy: Always
